[General]
# IPFE-IA vehicular simulation: 802.11p V2I via Veins, mobility via SUMO.
#
# Run (after starting sumo-launchd, see run_sim.sh):
#   ./ipfeia -u Cmdenv -c O2M_AGG --scenario=c100_v50
#
# Scenarios (scenarios/<name>/): c20_v50 c50_v50 c100_v50 c200_v50 c500_v50
#                                 c100_v30 c100_v80 c100_v120

network = ipfeia.IPFEIAScenario
sim-time-limit = 300s

cmdenv-express-mode = true
cmdenv-status-frequency = 30s
cmdenv-log-prefix = "[%t] %m: "
**.vector-recording = false
**.scalar-recording = false
**.debug = false

# ---- scenario geometry (RSU grid + playground size, generated) -------------
include scenarios/rsu_positions.ini
image-path = "../veins-src/images;scenarios/c100_v50"

# ---- SUMO coupling ----------------------------------------------------------
# The active scenario is selected by overriding *.manager.launchConfig from
# the command line (run_sim.sh) -- OMNeT++ 6 accepts per-object keys there
# and gives them precedence over ini entries.
*.manager.updateInterval = 0.1s
*.manager.host = "127.0.0.1"
*.manager.port = 9999
*.manager.autoShutdown = true
*.manager.launchConfig = xmldoc("scenarios/c100_v50/ipfeia.launchd.xml")

# ---- application types -------------------------------------------------------
*.node[*].applType = "ipfeia.VehicleApp"
*.rsu[*].applType = "ipfeia.RSUApp"

# ---- vehicle mobility (positions come from SUMO via TraCI; RSU positions in rsu_positions.ini)
*.node[*].veinsmobility.x = 0
*.node[*].veinsmobility.y = 0
*.node[*].veinsmobility.z = 0

# ---- radio / channel (802.11p, 5.9 GHz, 10 MHz) -----------------------------
*.connectionManager.sendDirect = true
*.connectionManager.maxInterfDist = 1000m
*.connectionManager.drawMaxIntfDist = false
*.**.nic.mac1609_4.useServiceChannel = false
*.**.nic.mac1609_4.txPower = 100mW
*.**.nic.mac1609_4.bitrate = 6Mbps
*.**.nic.phy80211p.minPowerLevel = -89dBm
*.**.nic.phy80211p.useNoiseFloor = true
*.**.nic.phy80211p.noiseFloor = -98dBm
*.**.nic.phy80211p.usePropagationDelay = true
*.**.nic.phy80211p.analogueModels = xmldoc("config_alpha3.xml")
*.**.nic.phy80211p.decider = xmldoc("config_alpha3.xml")

# ---- measured cryptographic costs (jPBC, Type-A curve; crypto-bench) --------
# E_g1 = 5.5002 ms, M_g1 = 0.0225 ms, E_g2 = 5.5137 ms, M_g2 = 0.0244 ms,
# E_t = 0.3145 ms, M_t = 0.0026 ms, BM = 2.7545 ms, M_zr = 0.00021 ms,
# |G_1| = |G_T| = 128 B, |Z_q| = 20 B
**.cryptoEg1 = 5.5002ms
**.cryptoMg1 = 0.0225ms
**.cryptoEg2 = 5.5137ms
**.cryptoMg2 = 0.0244ms
**.cryptoEt = 0.3145ms
**.cryptoMt = 0.0026ms
**.cryptoBM = 2.7545ms
**.cryptoMzr = 0.00021ms
**.sizeG1 = 128
**.sizeGT = 128
**.sizeZq = 20

# ---- protocol parameters -----------------------------------------------------
*.node[*].appl.eta = 3              # key-extraction threshold
*.node[*].appl.n = 10               # attribute vector dimension
*.node[*].appl.reportInterval = 5s  # ciphertext reporting period
*.node[*].appl.reauthInterval = 30s # periodic (synchronised) re-authentication
*.node[*].appl.authTimeout = 6s
*.node[*].appl.keyReqInterval = 0.5s

*.rsu[*].appl.aggWindow = 5s        # ciphertext aggregation window
*.rsu[*].appl.aggMode = "aggregated" # component-wise aggregation (Sec. optimized)
*.rsu[*].appl.backhaulDelay = 10ms  # RSU-AS wired backhaul one-way delay

*.as.batchWindow = 0.5s             # one-to-many batch collection window
*.as.ackWindow = 0.8s               # response collection window
*.as.backhaulDelay = 10ms
*.as.dlRange = 1024                 # brute-force DL result space
*.as.n = 10

# ---- experiment matrix -------------------------------------------------------
# Main scheme: one-to-many authentication + aggregated decryption
[Config O2M_AGG]
*.as.authMode = "o2m"
*.as.decMode = "aggregated"

# Baseline: same authentication, per-ciphertext decryption as in the original scheme
[Config O2M_PAPER]
*.as.authMode = "o2m"
*.as.decMode = "paper"

# Baseline: one-to-one authentication (AS cost grows linearly per vehicle)
[Config O2O_AGG]
*.as.authMode = "o2o"
*.as.decMode = "aggregated"

# Double baseline
[Config O2O_PAPER]
*.as.authMode = "o2o"
*.as.decMode = "paper"

# ---- one-to-one signature-based competitors ----------------------------------
# Representative instantiations of the identity-authentication schemes compared
# in the paper ([23] Seifelnasr et al., [24] He et al., [25] Hassan et al.).
# Each one performs a signature on the vehicle side and a pairing-based
# verification at the AS; because a signature scheme has no challenge/delta
# phase, o2oDelta* is 0 and the verification cost is carried by o2oVerify*.
# The per-operation counts are representative of a pairing-based signature
# (a light, a medium and a heavy point of the family), and the message sizes
# are exactly those of the communication-cost comparison (Table II).
# eta = 0: the competitors do not run the proposed partial-key extraction, and
# reportInterval is disabled so that only authentication traffic is generated.

[Config CMP_HE2023]
*.as.authMode = "o2o"
*.as.decMode = "aggregated"
*.as.o2oDeltaEg1 = 0
*.as.o2oDeltaBM = 0
*.as.o2oVerifyEg1 = 1
*.as.o2oVerifyBM = 1
*.node[*].appl.eta = 0
*.node[*].appl.signEg1Count = 1
*.node[*].appl.signBMCount = 0
*.node[*].appl.authMsgBytes = 268
*.node[*].appl.reportInterval = 1000000s

[Config CMP_HASSAN2022]
*.as.authMode = "o2o"
*.as.decMode = "aggregated"
*.as.o2oDeltaEg1 = 0
*.as.o2oDeltaBM = 0
*.as.o2oVerifyEg1 = 1
*.as.o2oVerifyBM = 2
*.node[*].appl.eta = 0
*.node[*].appl.signEg1Count = 1
*.node[*].appl.signBMCount = 0
*.node[*].appl.authMsgBytes = 316
*.node[*].appl.reportInterval = 1000000s

[Config CMP_SEIFELNASR2024]
*.as.authMode = "o2o"
*.as.decMode = "aggregated"
*.as.o2oDeltaEg1 = 0
*.as.o2oDeltaBM = 0
*.as.o2oVerifyEg1 = 2
*.as.o2oVerifyBM = 2
*.node[*].appl.eta = 0
*.node[*].appl.signEg1Count = 2
*.node[*].appl.signBMCount = 0
*.node[*].appl.authMsgBytes = 1104
*.node[*].appl.reportInterval = 1000000s

# ---- batch/broadcast-class competitor (reviewer M4) --------------------------
# A representative BLS-based batch/broadcast verification scheme (aggregate
# signatures, as in the batch-authentication class): every vehicle produces one
# short signature and the AS verifies the whole batch of n signatures together,
# which costs n+1 pairings, i.e. about ONE pairing per signature instead of the
# two pairings of individual verification.  The AS is therefore charged 1 BM per
# authenticated vehicle; the constant +1 pairing per batch is NOT charged, and
# neither is the verifier-side hash-to-G1, both of which favour this baseline
# (conservative for the proposed scheme).  Signing is one hash-to-G1 plus one
# scalar multiplication, charged as 1 E_g1 consistently with the other
# signature-based competitors; the message is one G1 element plus the identity
# (128 + 12 = 140 B).
[Config CMP_BLS_BATCH]
*.as.authMode = "o2o"
*.as.decMode = "aggregated"
*.as.o2oDeltaEg1 = 0
*.as.o2oDeltaBM = 0
*.as.o2oVerifyEg1 = 0
*.as.o2oVerifyBM = 1
*.node[*].appl.eta = 0
*.node[*].appl.signEg1Count = 1
*.node[*].appl.signBMCount = 0
*.node[*].appl.authMsgBytes = 140
*.node[*].appl.reportInterval = 1000000s

# GUI screenshot config: Qtenv with the real campus map as canvas background
[Config GUI]
extends = O2M_AGG
sim-time-limit = 120s
*.as.canvasBgImage = "campus_bg"
*.roadsCanvasVisualizer.enabled = false
